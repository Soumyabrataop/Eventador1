name: ci
on:
  # Automated triggers disabled to prevent email alerts.
  # Use manual workflow_dispatch if needed.
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: migration check (schema applies cleanly on fresh sqlite)
        run: npm run db:migrate
