#:schema main
name = "eventador"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "india-events"
database_id = "6ea5ec8e-9690-41cb-9ab3-f7550a66e309"

[vars]
DRY_RUN = "true"
VERIFY_LIMIT = "10"
LINK_LIMIT = "50"

# Cron triggers (Free plan friendly)
# "*/30 * * * *" = standard discovery & verification loop
# "0 2 * * *" = daily maintenance
[triggers]
crons = ["*/30 * * * *", "0 2 * * *"]
