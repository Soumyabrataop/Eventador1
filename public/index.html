<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventador — Autonomous Tech Events & Hackathon Radar</title>
  <meta name="description" content="Discover verified hackathons, developer meetups, conferences, and OSINT tech event leads across India and globally. 100% genuine registration links, zero spam.">
  <link rel="icon" type="image/png" href="/logo.png">
  
  <!-- Typography (Sans + Editorial Serif for Elixpo-style headlines + Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ==========================================================================
       Theme Palette: Elixpo Warm Porcelain / Deep Charcoal with Vibrant Accents
       ========================================================================== */
    :root {
      --color-green: #10b981;
      --color-yellow: #f59e0b;
      --color-red: #ef4444;
      --color-orange: #f97316;
      --color-blue: #3b82f6;
      --color-violet: #8b5cf6;
      --color-pink: #ec4899;

      /* Light Theme (Warm Porcelain / Paper Cream) */
      --bg: #fcfbf9;
      --surface: #ffffff;
      --surface-subtle: #f6f5f0;
      --surface-hover: #ecebe4;
      --border: #e7e5dc;
      --border-focus: #2563eb;
      --text: #18181b;
      --text-muted: #71717a;
      --text-sub: #3f3f46;
      --navbar-bg: rgba(255, 255, 255, 0.88);
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      --card-shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.08);
      
      --badge-free-bg: #ecfdf5;
      --badge-free-text: #059669;
      --badge-free-border: #a7f3d0;
      --badge-paid-bg: #fffbeb;
      --badge-paid-text: #d97706;
      --badge-paid-border: #fde68a;
      --badge-online-bg: #eff6ff;
      --badge-online-text: #2563eb;
      --badge-online-border: #bfdbfe;
      --badge-type-bg: #f5f3ff;
      --badge-type-text: #7c3aed;
      --badge-type-border: #ddd6fe;
      --badge-local-bg: #fef2f2;
      --badge-local-text: #dc2626;
      --badge-local-border: #fecaca;
    }

    [data-theme="dark"] {
      /* Dark Theme (Deep Charcoal Black with Glowing Borders) */
      --bg: #090a0f;
      --surface: #11141e;
      --surface-subtle: #171c2a;
      --surface-hover: #1f2538;
      --border: #23293d;
      --border-focus: #60a5fa;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #cbd5e1;
      --navbar-bg: rgba(17, 20, 30, 0.88);
      --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --card-shadow-hover: 0 12px 36px rgba(0, 0, 0, 0.6);

      --badge-free-bg: rgba(16, 185, 129, 0.12);
      --badge-free-text: #34d399;
      --badge-free-border: rgba(16, 185, 129, 0.3);
      --badge-paid-bg: rgba(245, 158, 11, 0.12);
      --badge-paid-text: #fbbf24;
      --badge-paid-border: rgba(245, 158, 11, 0.3);
      --badge-online-bg: rgba(59, 130, 246, 0.12);
      --badge-online-text: #60a5fa;
      --badge-online-border: rgba(59, 130, 246, 0.3);
      --badge-type-bg: rgba(139, 92, 246, 0.12);
      --badge-type-text: #a78bfa;
      --badge-type-border: rgba(139, 92, 246, 0.3);
      --badge-local-bg: rgba(239, 68, 68, 0.12);
      --badge-local-text: #f87171;
      --badge-local-border: rgba(239, 68, 68, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Geometry Orbits (Elixpo Style) */
    .bg-orbits {
      position: absolute;
      top: -60px;
      right: -60px;
      width: 600px;
      height: 600px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
    [data-theme="dark"] .bg-orbits { opacity: 0.22; }

    /* ==========================================================================
       Navbar (Pill Container)
       ========================================================================== */
    .navbar-wrapper {
      position: sticky;
      top: 0.85rem;
      z-index: 100;
      display: flex;
      justify-content: center;
      padding: 0 1rem;
    }
    .navbar {
      width: 100%;
      max-width: 1140px;
      background: var(--navbar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.5rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .brand-logo-img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }
    .brand-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 9999px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .nav-link {
      padding: 0.4rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border: 1px solid transparent;
    }
    .nav-link:hover {
      color: var(--text);
      background: var(--surface-hover);
    }
    .nav-link.active {
      background: var(--surface-subtle);
      color: var(--text);
      font-weight: 700;
      border-color: var(--border);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    /* 3-Way Theme Switcher */
    .theme-switcher {
      display: inline-flex;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 2px;
    }
    .theme-btn {
      background: transparent;
      border: none;
      padding: 0.28rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.2rem;
      transition: all 0.15s ease;
    }
    .theme-btn:hover { color: var(--text); }
    .theme-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-weight: 700;
    }

    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--text);
      color: var(--bg);
      padding: 0.42rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .btn-action-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-action-warm {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--color-orange);
      color: #ffffff;
      padding: 0.42rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-action-warm:hover { opacity: 0.92; transform: translateY(-1px); }

    /* ==========================================================================
       Compact Hero & Animated 3D Cards Deck
       ========================================================================== */
    .hero-container {
      max-width: 1140px;
      margin: 1.5rem auto 0.5rem;
      padding: 1.25rem 1.25rem 0.5rem;
      display: grid;
      grid-template-columns: 1.2fr 0.95fr;
      align-items: center;
      gap: 2rem;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 860px) {
      .hero-container {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--color-orange);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .hero-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.035em;
      color: var(--text);
    }
    .hero-title em {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--text);
    }
    .hero-desc {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.55;
      max-width: 520px;
    }
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    /* Animated 3D Stacked Cards Deck */
    .deck-container {
      position: relative;
      width: 100%;
      height: 290px;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .deck-card {
      position: absolute;
      width: 290px;
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      transition: all 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      user-select: none;
    }
    /* 3 Visible Deck Slots */
    .deck-slot-0 {
      /* Front Active Card */
      z-index: 10;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.35rem;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      opacity: 1;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
    }
    .deck-slot-1 {
      /* Middle Peeking Card (Burnt Orange) */
      z-index: 5;
      background: var(--color-orange);
      color: #fff;
      padding: 1.35rem;
      transform: translate3d(24px, -18px, -40px) rotate(5deg) scale(0.96);
      opacity: 0.95;
    }
    .deck-slot-2 {
      /* Back Peeking Card (Warm Amber Yellow) */
      z-index: 2;
      background: var(--color-yellow);
      color: #1c1917;
      padding: 1.35rem;
      transform: translate3d(48px, -36px, -80px) rotate(11deg) scale(0.91);
      opacity: 0.88;
    }
    .deck-slot-hidden {
      z-index: 1;
      transform: translate3d(-100px, 40px, -120px) rotate(-15deg) scale(0.85);
      opacity: 0;
      pointer-events: none;
    }

    .card-indicator-dots {
      position: absolute;
      bottom: -10px;
      right: 50%;
      transform: translateX(50%);
      display: flex;
      gap: 6px;
      z-index: 20;
    }
    .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .indicator-dot.active {
      background: var(--color-orange);
      width: 20px;
    }

    /* Minimal Stats Strip */
    .metrics-bar {
      max-width: 1140px;
      margin: 0.75rem auto 1.5rem;
      padding: 0.65rem 1.25rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.84rem;
      color: var(--text-muted);
    }
    .metric-item {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }
    .metric-num {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--text);
      font-size: 0.95rem;
    }

    /* Location Detection & City Selector Strip */
    .location-strip {
      max-width: 1140px;
      margin: 0 auto 1.25rem;
      padding: 0 1.25rem;
    }
    .location-bar {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.65rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .location-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .location-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .city-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    .btn-detect {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: background 0.15s ease;
    }
    .btn-detect:hover { background: var(--surface-hover); }

    /* ==========================================================================
       Page Sections / Separate Views
       ========================================================================== */
    .page-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
    }

    .section-header {
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .section-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Cards Grid */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.25rem;
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }
    .event-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--card-shadow-hover);
      border-color: #cbd5e1;
    }
    [data-theme="dark"] .event-card:hover { border-color: #334155; }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .badge-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.18rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.02em;
    }
    .badge-type { background: var(--badge-type-bg); color: var(--badge-type-text); border: 1px solid var(--badge-type-border); }
    .badge-online { background: var(--badge-online-bg); color: var(--badge-online-text); border: 1px solid var(--badge-online-border); }
    .badge-free { background: var(--badge-free-bg); color: var(--badge-free-text); border: 1px solid var(--badge-free-border); }
    .badge-paid { background: var(--badge-paid-bg); color: var(--badge-paid-text); border: 1px solid var(--badge-paid-border); }
    .badge-local { background: var(--badge-local-bg); color: var(--badge-local-text); border: 1px solid var(--badge-local-border); }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .card-org {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .card-meta-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: var(--text-sub);
      padding: 0.75rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.95rem;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .btn-card-register {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: opacity 0.15s ease;
      cursor: pointer;
    }
    .btn-card-register:hover { opacity: 0.88; }
    .btn-card-details {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-card-details:hover { background: var(--surface-hover); }

    /* Explore Filter Bar */
    .filter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.15rem;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .search-row {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon-svg {
      position: absolute;
      left: 0.9rem;
      width: 17px;
      height: 17px;
      fill: var(--text-muted);
      pointer-events: none;
    }
    .search-field {
      width: 100%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.68rem 1rem 0.68rem 2.6rem;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-field:focus { border-color: var(--border-focus); }

    .dropdowns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.75rem;
    }
    .dropdown-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .dropdown-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .dropdown-select {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.7rem;
      font-size: 0.85rem;
      font-family: inherit;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    /* Radar Scanning Animation for Near Me */
    .radar-banner {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.08), rgba(59, 130, 246, 0.08));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .radar-circle {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 9999px;
      background: rgba(249, 115, 22, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .radar-ping {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      border: 2px solid var(--color-orange);
      animation: radarPulse 2s infinite ease-out;
    }
    @keyframes radarPulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* OSINT Tools Grid */
    .osint-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .osint-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;

            root.setAttribute("data-theme", mql.matches ? "dark" : "light");
          };
          applySystem();
          mql.addEventListener("change", applySystem);
          return () => mql.removeEventListener("change", applySystem);
        } else {
          root.setAttribute("data-theme", themePref);
        }
      }, [themePref]);

        window.scrollTo({ top: 0, behavior: "smooth" });

        const handleHashChange = () => {
          const hash = window.location.hash.replace("#", "");
          if (["home", "explore", "hackathons", "meetups", "nearme", "osint"].includes(hash)) {
            setActiveTab(hash);
          }
        };
        window.addEventListener("hashchange", handleHashChange);
        return () => window.removeEventListener("hashchange", handleHashChange);
      }, []);

      // Fetch live verified events from Cloudflare Worker API
      useEffect(() => {
        fetch("https://eventador.eventador.workers.dev/api/events")
          .then((res) => res.json())
          .then((data) => {
            if (data && data.events && data.events.length > 0) {
              setEvents(data.events);
            }
          })
          .catch(() => {
            console.log("Serving cached verified events feed.");
          });
      }, []);

      useEffect(() => {
        if (isHovered || heroDeckEvents.length === 0) return;
        const interval = setInterval(() => {
          setDeckIndex((prev) => (prev + 1) % heroDeckEvents.length);
        }, 3500);
        return () => clearInterval(interval);
      }, [isHovered, heroDeckEvents.length]);

      // Geolocation detection handler
      const detectUserLocation = () => {
        if (!navigator.geolocation) {
          setLocationNote("Geolocation is not supported by your browser.");
          return;
        }
        setDetectingLocation(true);
        setLocationNote("Pinpointing nearby tech hub...");

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;

            // Calculate Euclidean distance to nearest tech city
            let closest = CITY_COORDINATES[0];
            let minDist = Infinity;
            for (const city of CITY_COORDINATES) {
              const d = Math.hypot(city.lat - userLat, city.lng - userLng);
              if (d < minDist) {
                minDist = d;
                closest = city;
              }
            }

            setUserCity(closest.name);
            localStorage.setItem("eventador-city", closest.name);
            setDetectingLocation(false);
            setLocationNote(`📍 Nearest detected tech hub: ${closest.name}`);
          },
          (err) => {
            setDetectingLocation(false);
            setLocationNote("Location access declined. Please choose your city manually.");
          },
          { timeout: 8000 }
        );
      };

                    </button>
                  </div>
                </div>

                {/* Animated 3D Cards Deck (Cycles cards smoothly one after another) */}
                <div
                  className="deck-container"
                  onMouseEnter={() => setIsHovered(true)}
                  onMouseLeave={() => setIsHovered(false)}
                >
                  {heroDeckEvents.map((ev, i) => {
                    const diff = (i - deckIndex + heroDeckEvents.length) % heroDeckEvents.length;
                    let slotClass = "deck-slot-hidden";
                    if (diff === 0) slotClass = "deck-slot-0";
                    else if (diff === 1) slotClass = "deck-slot-1";
                    else if (diff === 2) slotClass = "deck-slot-2";

                    return (
                      <div
                        key={ev.event_id}
                        className={`deck-card ${slotClass}`}
                        onClick={() => setSelectedEvent(ev)}
                      >
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.5rem" }}>
                          <span style={{ fontSize: "0.68rem", fontWeight: 700, letterSpacing: "0.06em", fontFamily: "'JetBrains Mono', monospace", color: diff === 0 ? "var(--color-green)" : "#fff" }}>
                            ● VERIFIED EVENT PASS
                          </span>
                          <span style={{ fontSize: "0.68rem", fontWeight: 700, opacity: 0.85 }}>
                            {formatDate(ev.start_date)}
                          </span>
                        </div>
                        <h3 style={{ fontSize: "1.05rem", fontWeight: 800, lineHeight: 1.3, marginBottom: "0.35rem" }}>
                          {ev.title}
                        </h3>
                        <p style={{ fontSize: "0.8rem", opacity: diff === 0 ? 0.7 : 0.9 }}>
                          {ev.city ? `${ev.city} • ` : ""}{ev.format} • {ev.is_free ? "Free Entry" : "Paid"}
                        </p>
                        {diff === 0 && (
                          <div style={{ marginTop: "0.85rem", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span style={{ fontSize: "0.75rem", color: "var(--color-orange)", fontWeight: 700 }}>
                              {ev.prize || "Open Registration"}
                            </span>
                            <span style={{ fontSize: "0.75rem", fontWeight: 700, textDecoration: "underline" }}>
                              View Pass →
                            </span>
                          </div>
                        )}
                      </div>
                    );
                  })}

                  {/* Indicator Dots */}
                  <div className="card-indicator-dots">
                    {heroDeckEvents.map((_, i) => (
                      <div
                        key={i}
                        className={`indicator-dot ${i === deckIndex ? "active" : ""}`}
                        onClick={() => setDeckIndex(i)}
                      />
                    ))}
                  </div>
                </div>
              </header>

              {/* Minimal Stats Bar */}
              <section className="metrics-bar">
                <div className="metric-item">
                  <span className="metric-num">1,240+</span>
                  <span>Verified Tech Events</span>
                </div>
                <div className="metric-item">
                  <span className="metric-num">100%</span>
                  <span>First-Party Official Links</span>
                </div>
                <div className="metric-item">
                  <span className="metric-num">24/7</span>
                  <span>Continuous OSINT Radar</span>
                </div>
                <div className="metric-item">
                  <span className="metric-num">0</span>
                  <span>Phishing or Spam Links</span>
                </div>
              </section>

              {/* Immediate Trending Section (Directly visible without scrolling!) */}
              <div className="page-container">
                <div className="section-header">
                  <div>
                    <h2 className="section-title">🔥 Trending This Week</h2>
                    <p className="section-sub">Autonomous verified events happening across top developer communities.</p>
                  </div>
                  <button className="btn-card-details" onClick={() => navigateTo("explore")}>
                    View All {events.length} Events →
                  </button>
                </div>
                <div className="events-grid">
                  {events.slice(0, 6).map(renderEventCard)}
                </div>
              </div>
            </div>
          )}

          {/* ====================================================================
              PAGE 2: EXPLORE (Full Directory with Rich Filters & Search)
              ==================================================================== */}
          {activeTab === "explore" && (
            <div className="page-container">
              <div className="section-header">
                <div>
                  <h2 className="section-title">🌐 Explore Verified Events</h2>
                  <p className="section-sub">Filter by event format, technology domain, city, or pricing.</p>
                </div>
              </div>

              {/* Filter Panel */}
              <div className="filter-card">
                <div className="search-row">
                  <svg className="search-icon-svg" viewBox="0 0 20 20">
                    <path fillRule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clipRule="evenodd"/>
                  </svg>
                  <input
                    type="text"
                    className="search-field"
                    placeholder="Search events, organizers, technologies, or cities..."
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                  />
                </div>

                <div className="dropdowns-grid">
                  <div className="dropdown-group">
                    <label className="dropdown-label">Event Type</label>
                    <select className="dropdown-select" value={filterType} onChange={(e) => setFilterType(e.target.value)}>
                      <option value="ALL">All Event Types</option>
                      <option value="HACKATHON">Hackathons</option>
                      <option value="MEETUP">Meetups</option>
                      <option value="CONFERENCE">Conferences</option>
                      <option value="WORKSHOP">Workshops</option>
                      <option value="COMMUNITY">Community Summits</option>
                    </select>
                  </div>

                  <div className="dropdown-group">
                    <label className="dropdown-label">Format / Mode</label>
                    <select className="dropdown-select" value={filterFormat} onChange={(e) => setFilterFormat(e.target.value)}>
                      <option value="ALL">All Modes</option>
                      <option value="ONLINE">Online (Virtual)</option>
                      <option value="OFFLINE">In-Person (Offline)</option>
                      <option value="HYBRID">Hybrid</option>
                    </select>
                  </div>

                  <div className="dropdown-group">
                    <label className="dropdown-label">Pricing</label>
                    <select className="dropdown-select" value={filterPrice} onChange={(e) => setFilterPrice(e.target.value)}>
                      <option value="ALL">All Events</option>
                      <option value="1">Free Entry Only</option>
                      <option value="0">Paid Entry</option>
                    </select>
                  </div>

                  <div className="dropdown-group">
                    <label className="dropdown-label">Region / City</label>
                    <select className="dropdown-select" value={filterCity} onChange={(e) => setFilterCity(e.target.value)}>
                      <option value="ALL">All Locations</option>
                      <option value="Bengaluru">Bengaluru</option>
                      <option value="Delhi">Delhi NCR</option>
                      <option value="Mumbai">Mumbai</option>
                      <option value="Hyderabad">Hyderabad</option>
                      <option value="Pune">Pune</option>
                      <option value="Chennai">Chennai</option>
                      <option value="Kolkata">Kolkata</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* Event Cards */}
              <div className="section-header" style={{ marginBottom: "1rem" }}>
                <span style={{ fontSize: "0.88rem", color: "var(--text-muted)" }}>
                  Showing {exploreEvents.length} verified events
                </span>
              </div>
              <div className="events-grid">
                {exploreEvents.length > 0 ? (
                  exploreEvents.map(renderEventCard)
                ) : (
                  <p style={{ color: "var(--text-muted)", gridColumn: "1/-1", textAlign: "center", padding: "2rem" }}>
                    No events match your current filter criteria.
                  </p>
                )}
              </div>
            </div>
          )}

          {/* ====================================================================
              PAGE 3: HACKATHONS (Dedicated Hackathon & Ideathon Radar)
              ==================================================================== */}
          {activeTab === "hackathons" && (
            <div className="page-container">
              <div className="section-header">
                <div>
                  <h2 className="section-title">⚡ Hackathons & Coding Contests</h2>
                  <p className="section-sub">Discover competitive hackathons with prize pools, grants, and fast tracks.</p>
                </div>
              </div>
              <div className="events-grid">
                {hackathonEvents.map(renderEventCard)}
              </div>
            </div>
          )}

          {/* ====================================================================
              PAGE 4: MEETUPS (Dedicated Community & Developer Meetups)
              ==================================================================== */}
          {activeTab === "meetups" && (
            <div className="page-container">
              <div className="section-header">
                <div>
                  <h2 className="section-title">🤝 Developer Meetups & User Groups</h2>
                  <p className="section-sub">Local GDG chapters, AWS user groups, React & Rust meetups.</p>
                </div>
              </div>
              <div className="events-grid">
                {meetupEvents.map(renderEventCard)}
              </div>
            </div>
          )}

          {/* ====================================================================
              PAGE 5: NEAR ME (Offline & Social Radar with Radar Animation)
              ==================================================================== */}
          {activeTab === "nearme" && (
            <div className="page-container">
              {/* Radar Scanner Banner */}
              <div className="radar-banner">
                <div className="radar-circle">
                  <div className="radar-ping"></div>
                  <span style={{ fontSize: "1.4rem" }}>📍</span>
                </div>
                <div>
                  <h3 style={{ fontSize: "1.2rem", fontWeight: 800, marginBottom: "0.25rem" }}>
                    Autonomous Offline Event Radar
                  </h3>
                  <p style={{ fontSize: "0.88rem", color: "var(--text-muted)" }}>
                    Showing in-person and hybrid tech events located in <strong>{userCity === "ALL" ? "All Indian Hubs" : userCity}</strong>. Use the city bar above to pinpoint your hometown.
                  </p>
                </div>
              </div>

              <div className="section-header">
                <div>
                  <h2 className="section-title">📍 Nearby In-Person Events</h2>
                  <p className="section-sub">{nearMeEvents.length} events happening near your selected location.</p>
                </div>
              </div>
              <div className="events-grid">
                {nearMeEvents.length > 0 ? (
                  nearMeEvents.map(renderEventCard)
                ) : (
                  <p style={{ color: "var(--text-muted)", gridColumn: "1/-1", textAlign: "center", padding: "2rem" }}>
                    No upcoming offline events scheduled for {userCity} yet. Try switching to "All Hubs" or exploring virtual events!
                  </p>
                )}
              </div>
            </div>
          )}

          {/* ====================================================================
              PAGE 6: OSINT TOOLS (Google Search Dorks & GitHub OSINT Radar)
              ==================================================================== */}
          {activeTab === "osint" && (
            <div className="page-container">
              <div className="section-header">
                <div>
                  <h2 className="section-title">🔍 Google Search OSINT & Social Radar</h2>
                  <p className="section-sub">Curated open-intelligence dorks to discover unlisted events on Lu.ma, Twitter/X, LinkedIn, and GitHub.</p>
                </div>
              </div>

              {/* OSINT Dorks Grid */}
              <div className="osint-grid">
                {OSINT_DORKS.map((dork, i) => (
                  <div key={i} className="osint-card">
                    <div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.4rem" }}>
                        <h3 style={{ fontSize: "1.05rem", fontWeight: 700 }}>{dork.title}</h3>
                        <span className="badge-pill badge-online">{dork.category}</span>
                      </div>
                      <p style={{ fontSize: "0.82rem", color: "var(--text-muted)", marginBottom: "0.75rem" }}>
                        {dork.desc}
                      </p>
                      <div className="osint-code">{dork.query}</div>
                    </div>
                    <a
                      href={dork.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="btn-card-register"
                      style={{ justifyContent: "center", marginTop: "0.5rem" }}
                    >
                      Launch Google OSINT Search ↗
                    </a>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Event Detail Modal */}
          {selectedEvent && (
            <div className="modal-backdrop" onClick={() => setSelectedEvent(null)}>
              <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                <button className="modal-close" onClick={() => setSelectedEvent(null)}>✕</button>
                <div className="card-badges" style={{ marginTop: "0.5rem" }}>
                  <span className="badge-pill badge-type">{selectedEvent.event_type || "EVENT"}</span>
                  <span className="badge-pill badge-online">{selectedEvent.format || "HYBRID"}</span>
                  <span className="badge-pill badge-free">{selectedEvent.is_free ? "FREE ENTRY" : "PAID ENTRY"}</span>
                </div>
                <h2 style={{ fontSize: "1.35rem", fontWeight: 800, margin: "0.75rem 0 0.35rem" }}>
                  {selectedEvent.title}
                </h2>
                <p style={{ fontSize: "0.88rem", color: "var(--text-muted)", marginBottom: "1rem" }}>
                  Organized by {selectedEvent.organizer_name || "Community Partner"}
                </p>

                <div className="card-meta-list" style={{ fontSize: "0.88rem" }}>
                  <div className="meta-row">
                    <span>📅</span>
                    <span>{formatDate(selectedEvent.start_date)} {selectedEvent.end_date ? `— ${formatDate(selectedEvent.end_date)}` : ""}</span>
                  </div>
                  <div className="meta-row">
                    <span>📍</span>
                    <span>{selectedEvent.city ? `${selectedEvent.city}, India` : "Online / Remote"} {selectedEvent.venue ? `(${selectedEvent.venue})` : ""}</span>
                  </div>
                  {selectedEvent.price_detail && (
                    <div className="meta-row">
                      <span>🎟️</span>
                      <span>{selectedEvent.price_detail}</span>
                    </div>
                  )}
                  {selectedEvent.prize && (
                    <div className="meta-row" style={{ color: "var(--color-orange)", fontWeight: 700 }}>
                      <span>🏆</span>
                      <span>{selectedEvent.prize}</span>
                    </div>
                  )}
                </div>

                <div style={{ marginTop: "1.25rem", display: "flex", gap: "0.75rem" }}>
                  <a
                    href={selectedEvent.registration_url || selectedEvent.event_url || "#"}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="btn-card-register"
                    style={{ flex: 1, justifyContent: "center", padding: "0.65rem 1rem" }}
                  >
                    Open Official Registration ↗
                  </a>
                  <button className="btn-card-details" onClick={() => setSelectedEvent(null)}>
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
