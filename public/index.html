<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventador — Discover Verified Tech Events, Hackathons & Meetups</title>
  <meta name="description" content="Discover verified tech hackathons, developer meetups, conferences, and workshops across India and worldwide. Authentic first-party registration links, zero scams.">
  <link rel="icon" type="image/png" href="/logo.png">
  
  <!-- Modern Typography (Sans + Editorial Serif for Elixpo-style headlines) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ==========================================================================
       Theme Variables: Happy, Colorful, Artistic yet Clean & Minimalist
       ========================================================================== */
    :root {
      /* Shared Palette (Happy, Vibrant, Artistic) */
      --color-green: #10b981;
      --color-yellow: #f59e0b;
      --color-red: #ef4444;
      --color-orange: #f97316;
      --color-blue: #3b82f6;
      --color-violet: #8b5cf6;
      --color-pink: #ec4899;

      /* Light Mode (Warm Porcelain / Paper Cream like Elixpo) */
      --bg: #fcfbf9;
      --surface: #ffffff;
      --surface-subtle: #f7f6f2;
      --surface-hover: #f1f0eb;
      --border: #e9e8e2;
      --border-focus: #2563eb;
      --text: #18181b;
      --text-muted: #71717a;
      --text-sub: #3f3f46;
      --navbar-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      --card-shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.08);
      --badge-free-bg: #ecfdf5;
      --badge-free-text: #059669;
      --badge-free-border: #a7f3d0;
      --badge-paid-bg: #fffbeb;
      --badge-paid-text: #d97706;
      --badge-paid-border: #fde68a;
      --badge-online-bg: #eff6ff;
      --badge-online-text: #2563eb;
      --badge-online-border: #bfdbfe;
      --badge-type-bg: #f5f3ff;
      --badge-type-text: #7c3aed;
      --badge-type-border: #ddd6fe;
      --hero-accent-bg: rgba(249, 115, 22, 0.04);
    }

    /* Dark Mode (Deep Charcoal Black with Glowing Artistic Accents) */
    [data-theme="dark"] {
      --bg: #090a0f;
      --surface: #11141e;
      --surface-subtle: #171c2a;
      --surface-hover: #1f2538;
      --border: #23293d;
      --border-focus: #60a5fa;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #cbd5e1;
      --navbar-bg: rgba(17, 20, 30, 0.85);
      --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --card-shadow-hover: 0 12px 36px rgba(0, 0, 0, 0.6);
      --badge-free-bg: rgba(16, 185, 129, 0.12);
      --badge-free-text: #34d399;
      --badge-free-border: rgba(16, 185, 129, 0.3);
      --badge-paid-bg: rgba(245, 158, 11, 0.12);
      --badge-paid-text: #fbbf24;
      --badge-paid-border: rgba(245, 158, 11, 0.3);
      --badge-online-bg: rgba(59, 130, 246, 0.12);
      --badge-online-text: #60a5fa;
      --badge-online-border: rgba(59, 130, 246, 0.3);
      --badge-type-bg: rgba(139, 92, 246, 0.12);
      --badge-type-text: #a78bfa;
      --badge-type-border: rgba(139, 92, 246, 0.3);
      --hero-accent-bg: rgba(59, 130, 246, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Geometric Orbit Lines (Inspired by Elixpo) */
    .bg-orbits {
      position: absolute;
      top: 0;
      right: 0;
      width: 650px;
      height: 650px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }
    [data-theme="dark"] .bg-orbits { opacity: 0.25; }

    /* ==========================================================================
       Floating Navbar (Pill Container like Elixpo)
       ========================================================================== */
    .navbar-wrapper {
      position: sticky;
      top: 1rem;
      z-index: 100;
      display: flex;
      justify-content: center;
      padding: 0 1rem;
    }
    .navbar {
      width: 100%;
      max-width: 1120px;
      background: var(--navbar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.1rem;
    }
    .brand-logo-img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }
    .brand-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 0.15rem 0.45rem;
      border-radius: 9999px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-link {
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .nav-link:hover {
      color: var(--text);
      background: var(--surface-hover);
    }
    .nav-link.active {
      background: var(--surface-subtle);
      color: var(--text);
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    /* 3-Way Theme Switcher (System / Light / Dark) */
    .theme-switcher {
      display: inline-flex;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 2px;
    }
    .theme-btn {
      background: transparent;
      border: none;
      padding: 0.3rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: all 0.15s ease;
    }
    .theme-btn:hover { color: var(--text); }
    .theme-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-weight: 600;
    }

    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--text);
      color: var(--bg);
      padding: 0.45rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .btn-action-primary:hover { opacity: 0.9; }

    .btn-action-warm {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--color-orange);
      color: #ffffff;
      padding: 0.45rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-action-warm:hover { opacity: 0.92; transform: translateY(-1px); }

    /* ==========================================================================
       Hero Section (Elixpo Painting Style: Big Headline + Floating Cards)
       ========================================================================== */
    .hero-container {
      max-width: 1120px;
      margin: 2.5rem auto 1rem;
      padding: 2rem 1.5rem 1rem;
      display: grid;
      grid-template-columns: 1.25fr 0.9fr;
      align-items: center;
      gap: 2.5rem;
      position: relative;
      z-index: 1;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--color-orange);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .hero-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(2.4rem, 5.2vw, 3.8rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.035em;
      color: var(--text);
    }
    /* Elegant Serif Accent in Headline */
    .hero-title em {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--text);
      padding: 0 0.15rem;
    }
    .hero-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 520px;
    }
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.85rem;
      margin-top: 0.5rem;
    }

    /* Stacked Floating Cards Illustration (Painting Theme like Elixpo) */
    .hero-art {
      position: relative;
      width: 100%;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .art-card {
      position: absolute;
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Yellow card in back */
    .art-card-1 {
      width: 240px;
      height: 170px;
      background: var(--color-yellow);
      top: 15px;
      right: 25px;
      transform: rotate(8deg);
    }
    /* Coral red card in middle */
    .art-card-2 {
      width: 250px;
      height: 180px;
      background: var(--color-orange);
      top: 55px;
      right: 50px;
      transform: rotate(-3deg);
    }
    /* Front clean card with badge */
    .art-card-front {
      width: 260px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.4rem;
      top: 95px;
      right: 75px;
      transform: rotate(1deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.14);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .front-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--color-green);
      font-family: 'JetBrains Mono', monospace;
    }
    .front-card-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
    }
    .front-card-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Clean Metrics Strip (Elixpo Style) */
    .metrics-bar {
      max-width: 1120px;
      margin: 1rem auto 2.5rem;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1.5rem;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .metric-item {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
    }
    .metric-num {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--text);
      font-size: 1.05rem;
    }

    /* ==========================================================================
       Filter & Search Section
       ========================================================================== */
    .filter-section {
      max-width: 1120px;
      margin: 0 auto 2rem;
      padding: 0 1.5rem;
    }
    .filter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.35rem;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .search-row {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon-svg {
      position: absolute;
      left: 1rem;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
    }
    .search-field {
      width: 100%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem 0.75rem 2.85rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-field:focus { border-color: var(--border-focus); }
    .search-field::placeholder { color: var(--text-muted); }

    .dropdowns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.85rem;
    }
    .dropdown-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .dropdown-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .dropdown-select {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-size: 0.88rem;
      font-family: inherit;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .dropdown-select:focus { border-color: var(--border-focus); }

    /* Quick Pills */
    .quick-pills-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .pills-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .filter-pill {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.32rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-pill:hover { border-color: var(--text-muted); color: var(--text); }
    .filter-pill.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .clear-btn:hover { color: var(--text); }

    /* ==========================================================================
       Results & Event Cards Grid
       ========================================================================== */
    .results-count-bar {
      max-width: 1120px;
      margin: 0 auto 1.25rem;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .events-grid-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }
    .event-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--card-shadow-hover);
      border-color: #d1d5db;
    }
    [data-theme="dark"] .event-card:hover { border-color: #3b4256; }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
    }
    .badge-pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.02em;
    }
    .badge-type { background: var(--badge-type-bg); color: var(--badge-type-text); border: 1px solid var(--badge-type-border); }
    .badge-online { background: var(--badge-online-bg); color: var(--badge-online-text); border: 1px solid var(--badge-online-border); }
    .badge-free { background: var(--badge-free-bg); color: var(--badge-free-text); border: 1px solid var(--badge-free-border); }
    .badge-paid { background: var(--badge-paid-bg); color: var(--badge-paid-text); border: 1px solid var(--badge-paid-border); }

    .card-title {
      font-size: 1.18rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .card-organizer {
      font-size: 0.86rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }
    .verified-tick {
      width: 14px;
      height: 14px;
      fill: var(--color-blue);
    }

    .card-details-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-size: 0.84rem;
      color: var(--text-sub);
      margin-bottom: 1.25rem;
    }
    .detail-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .detail-icon {
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      flex-shrink: 0;
    }

    .card-actions-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: auto;
    }
    .btn-card-register {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: var(--text);
      color: var(--bg);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .btn-card-register:hover { opacity: 0.88; }
    .btn-card-details {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-card-details:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    /* Modal Backdrop & Content */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .modal-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 620px;
      width: 100%;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
    }
    .modal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .modal-close {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 860px) {
      .hero-container { grid-template-columns: 1fr; gap: 2rem; text-align: center; }
      .hero-desc { margin: 0 auto; }
      .hero-buttons { justify-content: center; }
      .hero-art { display: none; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <!-- Decorative Background Geometric Orbits (Painting Style like Elixpo) -->
  <svg className="bg-orbits" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="350" cy="150" r="180" stroke="var(--border)" strokeWidth="1.2" strokeDasharray="3 3"/>
    <circle cx="350" cy="150" r="120" stroke="var(--border)" strokeWidth="1.2"/>
    <circle cx="350" cy="150" r="60" stroke="var(--border)" strokeWidth="1"/>
    <circle cx="230" cy="150" r="4" fill="var(--color-orange)"/>
    <circle cx="390" cy="230" r="3" fill="var(--color-yellow)"/>
    <circle cx="310" cy="70" r="4" fill="var(--color-blue)"/>
  </svg>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icons
    const SvgCalendar = () => (
      <svg className="detail-icon" viewBox="0 0 20 20">
        <path d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"/>
      </svg>
    );

    const SvgMapPin = () => (
      <svg className="detail-icon" viewBox="0 0 20 20">
        <path fillRule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clipRule="evenodd"/>
      </svg>
    );

    const SvgExternal = () => (
      <svg style={{ width: 14, height: 14, fill: "currentColor" }} viewBox="0 0 20 20">
        <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
        <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/>
      </svg>
    );

    // Initial curated events for instant display
    const CURATED_SEED_EVENTS = [
      {
        event_id: "seed-1",
        title: "Smart India Hackathon 2026",
        organizer_name: "Ministry of Education & AICTE",
        format: "HYBRID",
        event_type: "HACKATHON",
        is_free: 1,
        city: "New Delhi",
        start_date: "2026-11-15T00:00:00Z",
        end_date: "2026-11-18T00:00:00Z",
        event_url: "https://www.sih.gov.in",
        registration_url: "https://www.sih.gov.in",
        prize: "₹1,00,00,000+ Prize Pool"
      },
      {
        event_id: "seed-2",
        title: "Google Developer Groups DevFest 2026",
        organizer_name: "Google Developers India",
        format: "OFFLINE",
        event_type: "CONFERENCE",
        is_free: 1,
        city: "Bengaluru",
        start_date: "2026-11-20T09:00:00Z",
        end_date: "2026-11-21T18:00:00Z",
        event_url: "https://developers.google.com/community/gdg",
        registration_url: "https://developers.google.com/community/gdg",
        prize: "Swag, Certification & Networking"
      },
      {
        event_id: "seed-3",
        title: "AWS Community Day India 2026",
        organizer_name: "AWS User Group",
        format: "HYBRID",
        event_type: "CONFERENCE",
        is_free: 1,
        city: "Hyderabad",
        start_date: "2026-11-28T09:00:00Z",
        end_date: "2026-11-28T18:00:00Z",
        event_url: "https://aws.amazon.com/developer/community/",
        registration_url: "https://aws.amazon.com/developer/community/",
        prize: "AWS Cloud Credits & Badges"
      },
      {
        event_id: "seed-4",
        title: "Hacktoberfest Global Celebration",
        organizer_name: "DigitalOcean & Cloudflare",
        format: "ONLINE",
        event_type: "COMMUNITY",
        is_free: 1,
        city: null,
        start_date: "2026-10-01T00:00:00Z",
        end_date: "2026-10-31T23:59:59Z",
        event_url: "https://hacktoberfest.com",
        registration_url: "https://hacktoberfest.com",
        prize: "Official Badges & Tree Plantings"
      },
      {
        event_id: "seed-5",
        title: "Microsoft Reactor AI & Cloud Workshop",
        organizer_name: "Microsoft Reactor Bengaluru",
        format: "HYBRID",
        event_type: "WORKSHOP",
        is_free: 1,
        city: "Bengaluru",
        start_date: "2026-12-05T10:00:00Z",
        end_date: "2026-12-05T16:00:00Z",
        event_url: "https://developer.microsoft.com/en-us/reactor/",
        registration_url: "https://developer.microsoft.com/en-us/reactor/",
        prize: "Hands-on Azure Labs"
      },
      {
        event_id: "seed-6",
        title: "Luma Web3 & AI Founders Meetup",
        organizer_name: "Tech Founders Club",
        format: "OFFLINE",
        event_type: "MEETUP",
        is_free: 0,
        price_detail: "₹499 (Includes food & beverage)",
        city: "Mumbai",
        start_date: "2026-12-12T17:00:00Z",
        end_date: "2026-12-12T20:00:00Z",
        event_url: "https://lu.ma",
        registration_url: "https://lu.ma",
        prize: "Pitching Session with VCs"
      }
    ];

    function App() {
      const [events, setEvents] = useState(CURATED_SEED_EVENTS);
      const [loading, setLoading] = useState(false);
      
      // Theme state: 'system' | 'light' | 'dark'
      const [themePref, setThemePref] = useState(() => {
        return localStorage.getItem("eventador-theme") || "system";
      });

      // Filter states
      const [search, setSearch] = useState("");
      const [type, setType] = useState("ALL");
      const [format, setFormat] = useState("ALL");
      const [isFree, setIsFree] = useState("ALL");
      const [city, setCity] = useState("ALL");
      const [selectedEvent, setSelectedEvent] = useState(null);

      // Handle Theme Applying
      useEffect(() => {
        const root = document.documentElement;
        localStorage.setItem("eventador-theme", themePref);

        if (themePref === "system") {
          const mql = window.matchMedia("(prefers-color-scheme: dark)");
          const applySystem = () => {
            root.setAttribute("data-theme", mql.matches ? "dark" : "light");
          };
          applySystem();
          mql.addEventListener("change", applySystem);
          return () => mql.removeEventListener("change", applySystem);
        } else {
          root.setAttribute("data-theme", themePref);
        }
      }, [themePref]);

      // Fetch live verified events from Cloudflare Worker API
      useEffect(() => {
        fetch("https://eventador.eventador.workers.dev/api/events")
          .then((res) => res.json())
          .then((data) => {
            if (data && data.events && data.events.length > 0) {
              setEvents(data.events);
            }
          })
          .catch((err) => {
            console.log("Using cached curated events feed.", err);
          });
      }, []);

      const filteredEvents = useMemo(() => {
        return events.filter((ev) => {
          if (type !== "ALL" && ev.event_type !== type) return false;
          if (format !== "ALL" && ev.format !== format) return false;
          if (isFree !== "ALL" && String(ev.is_free) !== String(isFree)) return false;
          if (city !== "ALL" && (!ev.city || !ev.city.toLowerCase().includes(city.toLowerCase()))) return false;
          
          if (search.trim()) {
            const q = search.toLowerCase();
            const titleMatch = ev.title && ev.title.toLowerCase().includes(q);
            const orgMatch = ev.organizer_name && ev.organizer_name.toLowerCase().includes(q);
            const cityMatch = ev.city && ev.city.toLowerCase().includes(q);
            if (!titleMatch && !orgMatch && !cityMatch) return false;
          }
          return true;
        });
      }, [events, search, type, format, isFree, city]);

      const resetFilters = () => {
        setSearch("");
        setType("ALL");
        setFormat("ALL");
        setIsFree("ALL");
        setCity("ALL");
      };

      const formatDate = (dateStr) => {
        if (!dateStr) return "Upcoming";
        try {
          const d = new Date(dateStr);
          return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        } catch {
          return dateStr;
        }
      };

      return (
        <div>
          {/* Floating Pill Navbar (Elixpo Style) */}
          <div className="navbar-wrapper">
            <nav className="navbar">
              <a href="/" className="nav-brand">
                <img src="/logo.png" alt="Eventador" className="brand-logo-img" onError={(e) => { e.target.style.display = 'none'; }} />
                <span>Eventador</span>
                <span className="brand-badge">VERIFIED</span>
              </a>

              <div className="nav-links">
                <span className={"nav-link " + (type === "ALL" ? "active" : "")} onClick={() => setType("ALL")}>Explore</span>
                <span className={"nav-link " + (type === "HACKATHON" ? "active" : "")} onClick={() => setType("HACKATHON")}>Hackathons</span>
                <span className={"nav-link " + (type === "MEETUP" ? "active" : "")} onClick={() => setType("MEETUP")}>Meetups</span>
                <span className={"nav-link " + (type === "CONFERENCE" ? "active" : "")} onClick={() => setType("CONFERENCE")}>Conferences</span>
                <span className={"nav-link " + (format === "ONLINE" ? "active" : "")} onClick={() => setFormat(format === "ONLINE" ? "ALL" : "ONLINE")}>Virtual</span>
              </div>

              <div className="nav-actions">
                {/* 3-Way Theme Toggle */}
                <div className="theme-switcher">
                  <button 
                    className={"theme-btn " + (themePref === "light" ? "active" : "")} 
                    onClick={() => setThemePref("light")}
                    title="Light Mode"
                  >
                    ☀️ Light
                  </button>
                  <button 
                    className={"theme-btn " + (themePref === "dark" ? "active" : "")} 
                    onClick={() => setThemePref("dark")}
                    title="Dark Mode"
                  >
                    🌙 Dark
                  </button>
                  <button 
                    className={"theme-btn " + (themePref === "system" ? "active" : "")} 
                    onClick={() => setThemePref("system")}
                    title="System Default"
                  >
                    ⚙️ Auto
                  </button>
                </div>

                <a href="https://t.me/EventadorBot" target="_blank" rel="noopener noreferrer" className="btn-action-warm">
                  Telegram Bot
                </a>
              </div>
            </nav>
          </div>

          {/* Hero Section (Elixpo Painting Style) */}
          <header className="hero-container">
            <div className="hero-content">
              <div className="hero-eyebrow">
                <span>●</span> Happy Developer Intelligence
              </div>
              <h1 className="hero-title">
                Tech events, from <em>community</em> to <em>grand stage.</em>
              </h1>
              <p className="hero-desc">
                Eventador autonomously discovers and verifies upcoming hackathons, meetups, workshops, and summits across India and worldwide. 100% genuine registration links.
              </p>
              <div className="hero-buttons">
                <a href="#explore" className="btn-action-primary">
                  Explore Events ↘
                </a>
                <a href="https://discord.gg" target="_blank" rel="noopener noreferrer" className="filter-pill" style={{ padding: "0.5rem 1rem" }}>
                  Join Discord Community
                </a>
              </div>
            </div>

            {/* Stack of Floating Cheerful Cards */}
            <div className="hero-art">
              <div className="art-card art-card-1"></div>
              <div className="art-card art-card-2"></div>
              <div className="art-card art-card-front">
                <div className="front-card-badge">● VERIFIED EVENT PASS</div>
                <div className="front-card-title">Smart India Hackathon 2026</div>
                <div className="front-card-sub">New Delhi • Hybrid • Free Entry</div>
              </div>
            </div>
          </header>

          {/* Metrics Strip */}
          <section className="metrics-bar">
            <div className="metric-item">
              <span className="metric-num">1,240+</span>
              <span>Verified Tech Events</span>
            </div>
            <div className="metric-item">
              <span className="metric-num">100%</span>
              <span>First-Party Genuine Links</span>
            </div>
            <div className="metric-item">
              <span className="metric-num">24/7</span>
              <span>Autonomous Radar</span>
            </div>
            <div className="metric-item">
              <span className="metric-num">0</span>
              <span>Phishing or Spam Links</span>
            </div>
          </section>

          {/* Filter Panel */}
          <section className="filter-section" id="explore">
            <div className="filter-card">
              {/* Search Bar */}
              <div className="search-row">
                <svg className="search-icon-svg" viewBox="0 0 20 20">
                  <path fillRule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clipRule="evenodd"/>
                </svg>
                <input
                  type="text"
                  className="search-field"
                  placeholder="Search events, organizers, technologies, or cities..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                />
              </div>

              {/* Dropdowns */}
              <div className="dropdowns-grid">
                <div className="dropdown-group">
                  <label className="dropdown-label">Event Type</label>
                  <select className="dropdown-select" value={type} onChange={(e) => setType(e.target.value)}>
                    <option value="ALL">All Event Types</option>
                    <option value="HACKATHON">Hackathons</option>
                    <option value="MEETUP">Meetups</option>
                    <option value="CONFERENCE">Conferences</option>
                    <option value="WORKSHOP">Workshops</option>
                    <option value="COMPETITION">Competitions</option>
                  </select>
                </div>

                <div className="dropdown-group">
                  <label className="dropdown-label">Format / Mode</label>
                  <select className="dropdown-select" value={format} onChange={(e) => setFormat(e.target.value)}>
                    <option value="ALL">All Modes</option>
                    <option value="ONLINE">Online (Virtual)</option>
                    <option value="OFFLINE">In-Person (Offline)</option>
                    <option value="HYBRID">Hybrid</option>
                  </select>
                </div>

                <div className="dropdown-group">
                  <label className="dropdown-label">Pricing</label>
                  <select className="dropdown-select" value={isFree} onChange={(e) => setIsFree(e.target.value)}>
                    <option value="ALL">All Events</option>
                    <option value="1">Free to Attend</option>
                    <option value="0">Paid</option>
                  </select>
                </div>

                <div className="dropdown-group">
                  <label className="dropdown-label">Region / City</label>
                  <select className="dropdown-select" value={city} onChange={(e) => setCity(e.target.value)}>
                    <option value="ALL">All Locations</option>
                    <option value="Bengaluru">Bengaluru</option>
                    <option value="Delhi">Delhi NCR</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Pune">Pune</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Kolkata">Kolkata</option>
                  </select>
                </div>
              </div>

              {/* Quick Pills */}
              <div className="quick-pills-row">
                <div className="pills-group">
                  <button className={"filter-pill " + (format === "ONLINE" ? "active" : "")} onClick={() => setFormat(format === "ONLINE" ? "ALL" : "ONLINE")}>
                    Online Only
                  </button>
                  <button className={"filter-pill " + (isFree === "1" ? "active" : "")} onClick={() => setIsFree(isFree === "1" ? "ALL" : "1")}>
                    Free Events
                  </button>
                  <button className={"filter-pill " + (type === "HACKATHON" ? "active" : "")} onClick={() => setType(type === "HACKATHON" ? "ALL" : "HACKATHON")}>
                    Hackathons
                  </button>
                  <button className={"filter-pill " + (type === "MEETUP" ? "active" : "")} onClick={() => setType(type === "MEETUP" ? "ALL" : "MEETUP")}>
                    Meetups
                  </button>
                </div>
                {(search || type !== "ALL" || format !== "ALL" || isFree !== "ALL" || city !== "ALL") && (
                  <button className="clear-btn" onClick={resetFilters}>
                    Clear all filters
                  </button>
                )}
              </div>
            </div>
          </section>

          {/* Results Bar */}
          <div className="results-count-bar">
            <span>Showing <strong>{filteredEvents.length}</strong> verified events</span>
            <span>Refreshed live across 30+ tech platforms</span>
          </div>

          {/* Events Grid */}
          <main className="events-grid-wrap">
            {filteredEvents.length === 0 ? (
              <div style={{ textAlign: "center", padding: "4rem 1rem", color: "var(--text-muted)" }}>
                <p style={{ fontSize: "1.1rem", marginBottom: "0.5rem" }}>No events found matching your filter selection.</p>
                <button className="filter-pill" onClick={resetFilters}>Reset Filters</button>
              </div>
            ) : (
              <div className="events-grid">
                {filteredEvents.map((ev) => (
                  <article key={ev.event_id} className="event-card">
                    <div>
                      <div className="card-badges">
                        <span className="badge-pill badge-type">{ev.event_type || "EVENT"}</span>
                        <span className="badge-pill badge-online">{ev.format || "ONLINE"}</span>
                        <span className={"badge-pill " + (ev.is_free === 0 ? "badge-paid" : "badge-free")}>
                          {ev.is_free === 0 ? "PAID" : "FREE"}
                        </span>
                      </div>

                      <h2 className="card-title">{ev.title}</h2>
                      <div className="card-organizer">
                        <span>{ev.organizer_name || "Community Partner"}</span>
                        <svg className="verified-tick" viewBox="0 0 20 20">
                          <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"/>
                        </svg>
                      </div>

                      <div className="card-details-box">
                        <div className="detail-line">
                          <SvgCalendar />
                          <span>{formatDate(ev.start_date)} {ev.end_date ? "– " + formatDate(ev.end_date) : ""}</span>
                        </div>
                        <div className="detail-line">
                          <SvgMapPin />
                          <span>{ev.format === "ONLINE" ? "Online / Global" : (ev.city ? ev.city + ", India" : "In-Person")}</span>
                        </div>
                        {ev.prize && (
                          <div className="detail-line" style={{ color: "var(--color-orange)", fontWeight: 600 }}>
                            <span>🏆 {ev.prize}</span>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="card-actions-row">
                      <a 
                        href={ev.registration_url || ev.event_url} 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        className="btn-card-register"
                      >
                        <span>Register</span>
                        <SvgExternal />
                      </a>
                      <button className="btn-card-details" onClick={() => setSelectedEvent(ev)}>
                        Details
                      </button>
                    </div>
                  </article>
                ))}
              </div>
            )}
          </main>

          {/* Details Modal */}
          {selectedEvent && (
            <div className="modal-overlay" onClick={() => setSelectedEvent(null)}>
              <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header-row">
                  <div>
                    <div className="card-badges" style={{ marginBottom: "0.5rem" }}>
                      <span className="badge-pill badge-type">{selectedEvent.event_type}</span>
                      <span className="badge-pill badge-online">{selectedEvent.format}</span>
                      <span className={"badge-pill " + (selectedEvent.is_free === 0 ? "badge-paid" : "badge-free")}>
                        {selectedEvent.is_free === 0 ? "PAID" : "FREE"}
                      </span>
                    </div>
                    <h2 style={{ fontSize: "1.35rem", fontWeight: 700 }}>{selectedEvent.title}</h2>
                    <p style={{ color: "var(--text-muted)", fontSize: "0.9rem" }}>Organized by {selectedEvent.organizer_name || "Community Partner"}</p>
                  </div>
                  <button className="modal-close" onClick={() => setSelectedEvent(null)}>&times;</button>
                </div>

                <div className="card-details-box">
                  <div className="detail-line"><SvgCalendar /><span>Dates: {formatDate(selectedEvent.start_date)} to {formatDate(selectedEvent.end_date)}</span></div>
                  <div className="detail-line"><SvgMapPin /><span>Location: {selectedEvent.venue || selectedEvent.city || selectedEvent.format}</span></div>
                  {selectedEvent.registration_deadline && (
                    <div className="detail-line"><span>Deadline: {formatDate(selectedEvent.registration_deadline)}</span></div>
                  )}
                  {selectedEvent.price_detail && (
                    <div className="detail-line"><span>Pricing: {selectedEvent.price_detail}</span></div>
                  )}
                  {selectedEvent.prize && (
                    <div className="detail-line" style={{ color: "var(--color-orange)", fontWeight: 600 }}><span>Prizes: {selectedEvent.prize}</span></div>
                  )}
                </div>

                <div style={{ display: "flex", gap: "0.75rem", marginTop: "0.5rem" }}>
                  <a 
                    href={selectedEvent.registration_url || selectedEvent.event_url} 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="btn-card-register"
                    style={{ padding: "0.75rem 1.25rem", textAlign: "center" }}
                  >
                    <span>Visit Official Registration Page</span>
                    <SvgExternal />
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer>
            <div style={{ maxWidth: 1120, margin: "0 auto", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: "1rem" }}>
              <span>&copy; {new Date().getFullYear()} Eventador. Open developer event intelligence.</span>
              <span>All links verified first-party. No phishing, zero ads.</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
